<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Planejador de estudos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#EFE9D8;
    --paper-2:#E6DFC9;
    --card:#F8F5E9;
    --ink:#24303D;
    --ink-soft:#4A5763;
    --line:#C9C0A4;
    --green:#2F6F4F;
    --green-dark:#1F4E37;
    --red:#B0413B;
    --red-light:#F4E1DF;
    --gold:#C69A3A;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }

  .margin-rule{
    position:fixed;
    top:0; left:48px; bottom:0;
    width:1px;
    background:var(--red);
    opacity:.35;
    pointer-events:none;
  }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:36px 32px 80px 72px;
  }

  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    margin:0 0 2px;
    letter-spacing:-.02px;
  }
  header p.sub{
    margin:0 0 24px;
    color:var(--ink-soft);
    font-size:14px;
    font-family:'IBM Plex Mono', monospace;
  }

  nav.tabs{
    display:flex;
    gap:2px;
    margin-bottom:0;
  }
  nav.tabs button{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:14px;
    padding:10px 20px 12px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    border-bottom:1px solid var(--card);
  }
  nav.tabs button:hover:not(.active){
    background:#DDD5BB;
  }

  main{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 8px 8px 8px;
    padding:28px;
    min-height:420px;
  }

  h2.section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 18px;
  }

  /* ---- Semana ---- */
  .week-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:14px;
  }
  .day-card{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    padding:12px;
    display:flex;
    flex-direction:column;
    min-height:160px;
  }
  .day-card h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .task-item{
    display:flex;
    align-items:flex-start;
    gap:7px;
    font-size:13px;
    margin-bottom:8px;
    line-height:1.4;
  }
  .task-item input[type=checkbox]{
    margin-top:2px;
    accent-color:var(--green);
    cursor:pointer;
    flex-shrink:0;
  }
  .task-item .txt.done{
    text-decoration:line-through;
    color:var(--ink-soft);
    opacity:.6;
  }
  .task-item .del-btn{
    margin-left:auto;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:0 2px;
    flex-shrink:0;
  }
  .task-item .del-btn:hover{ color:var(--red); }
  .subj-tag{
    display:inline-block;
    font-size:10px;
    font-family:'IBM Plex Mono', monospace;
    padding:1px 5px;
    border-radius:3px;
    margin-bottom:2px;
  }
  .add-task-btn{
    margin-top:auto;
    background:none;
    border:1px dashed var(--line);
    border-radius:6px;
    color:var(--ink-soft);
    font-size:12px;
    padding:6px;
    cursor:pointer;
    width:100%;
  }
  .add-task-btn:hover{ border-color:var(--green); color:var(--green); }

  /* ---- Disciplinas ---- */
  .subj-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .subj-row{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
    background:var(--paper);
  }
  .swatch{
    width:16px; height:16px; border-radius:50%;
    flex-shrink:0; border:1px solid rgba(0,0,0,.15);
  }
  .subj-row .name{ font-weight:500; flex:1; }
  .subj-row button{
    background:none; border:none; color:var(--ink-soft);
    cursor:pointer; font-size:13px;
  }
  .subj-row button:hover{ color:var(--red); }

  form.inline-form{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  form.inline-form input[type=text], form.inline-form select, form.inline-form textarea{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  form.inline-form input[type=text]{ flex:1; min-width:120px; }
  form.inline-form input[type=color]{
    width:34px; height:34px; padding:2px;
    border:1px solid var(--line); border-radius:6px; background:#fff;
    cursor:pointer;
  }
  form.inline-form button.submit{
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 16px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  form.inline-form button.submit:hover{ background:var(--green-dark); }

  /* ---- Calendario ---- */
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .cal-header .month-label{
    font-family:'Fraunces', serif; font-weight:600; font-size:18px;
  }
  .cal-header button{
    background:none; border:1px solid var(--line); border-radius:6px;
    width:30px; height:30px; cursor:pointer; font-size:14px; color:var(--ink);
  }
  .cal-header button:hover{ background:var(--paper); }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-bottom:24px;
  }
  .cal-dow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-align:center;
    padding-bottom:4px;
  }
  .cal-day{
    aspect-ratio:1;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    padding:5px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .cal-day:hover{ border-color:var(--green); }
  .cal-day.empty{ visibility:hidden; }
  .cal-day.selected{ background:#fff; border-color:var(--green); border-width:2px; }
  .cal-day.today .num{
    color:var(--red);
    font-weight:600;
  }
  .cal-day .num{ font-size:12px; font-family:'IBM Plex Mono', monospace; }
  .cal-day .dots{ display:flex; gap:2px; flex-wrap:wrap; margin-top:auto; }
  .cal-day .dot{ width:6px; height:6px; border-radius:50%; }

  .deadline-panel{
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .deadline-panel h3{
    font-size:14px; font-weight:500; margin:0 0 10px;
    font-family:'IBM Plex Mono', monospace;
  }
  .deadline-item{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 12px;
    border-left:3px solid var(--red);
    background:var(--red-light);
    border-radius:0 6px 6px 0;
    margin-bottom:8px;
  }
  .deadline-item .info{ flex:1; }
  .deadline-item .title{ font-weight:500; font-size:13px; }
  .deadline-item .meta{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; margin-top:2px; }
  .deadline-item button{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:14px;
  }
  .deadline-item button:hover{ color:var(--red); }

  .empty-msg{
    color:var(--ink-soft);
    font-size:13px;
    font-style:italic;
    padding:8px 0;
  }

  /* ---- Cronograma ---- */
  .syllabus-list{ display:flex; flex-direction:column; gap:14px; margin-bottom:22px; }
  .week-block{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    padding:12px 14px;
  }
  .week-block h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--green-dark);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .week-block.current{ border-color:var(--green); border-width:2px; }
  .week-block.current h3{ color:var(--green); }
  .syllabus-item{
    display:flex; align-items:flex-start; gap:8px;
    font-size:13px; margin-bottom:8px; line-height:1.4;
  }
  .syllabus-item:last-child{ margin-bottom:0; }
  .syllabus-item .info{ flex:1; }
  .syllabus-item .del-btn{
    background:none; border:none; color:var(--ink-soft);
    cursor:pointer; font-size:14px; line-height:1; padding:0 2px; flex-shrink:0;
  }
  .syllabus-item .del-btn:hover{ color:var(--red); }
  form.inline-form input[type=number]{
    width:80px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(36,48,61,.35);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
  }
  .modal{
    background:var(--card);
    border-radius:10px;
    border:1px solid var(--line);
    padding:22px;
    width:320px;
    max-width:90vw;
  }
  .modal h3{ margin:0 0 14px; font-family:'Fraunces', serif; font-size:17px; }
  .modal label{ font-size:12px; color:var(--ink-soft); display:block; margin:10px 0 4px; }
  .modal input, .modal select, .modal textarea{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:13px;
    padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    background:#fff; color:var(--ink);
  }
  .modal textarea{ resize:vertical; min-height:50px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .modal-actions button{
    font-size:13px; padding:7px 14px; border-radius:6px; cursor:pointer;
  }
  .modal-actions .cancel{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .modal-actions .save{ background:var(--green); border:none; color:#fff; font-weight:500; }
  .modal-actions .save:hover{ background:var(--green-dark); }

  .loading{ color:var(--ink-soft); font-size:13px; padding:20px 0; }
</style>
</head>
<body>
<div class="margin-rule"></div>
<div class="wrap">
  <header>
    <h1>Planejador de estudos</h1>
    <p class="sub">semana &middot; prazos &middot; disciplinas</p>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="semana" class="active">Semana</button>
    <button data-tab="cronograma">Cronograma</button>
    <button data-tab="calendario">Calendário</button>
    <button data-tab="disciplinas">Disciplinas</button>
  </nav>
  <main id="main">
    <div class="loading">Carregando...</div>
  </main>
</div>

<script>
const DAYS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DOW_LABELS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const SUBJ_COLORS = ['#4C6C9C','#C69A3A','#7A4C6E','#3E8A82','#B4623B','#5B6B73','#8A6C4C','#4C7A5E'];

let data = { subjects: [], weeklyTasks: [], deadlines: [], syllabus: [], currentWeek: 1 };
let currentTab = 'semana';
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedDate = null;

const KEY = 'planner-data-v1';

function loadData(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      data = JSON.parse(raw);
      if(!data.subjects) data.subjects = [];
      if(!data.weeklyTasks) data.weeklyTasks = [];
      if(!data.deadlines) data.deadlines = [];
      if(!data.syllabus) data.syllabus = [];
      if(!data.currentWeek) data.currentWeek = 1;
    }
  }catch(e){
    console.log('Nenhum dado salvo ainda, começando do zero.');
  }
  render();
}

function saveData(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
  }catch(e){
    console.error('Erro ao salvar', e);
  }
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function subjById(id){ return data.subjects.find(s=>s.id===id); }

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---------------- TABS ---------------- */
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

function render(){
  const main = document.getElementById('main');
  if(currentTab==='semana') main.innerHTML = renderSemana();
  else if(currentTab==='cronograma') main.innerHTML = renderCronograma();
  else if(currentTab==='calendario') main.innerHTML = renderCalendario();
  else main.innerHTML = renderDisciplinas();
  attachHandlers();
}

/* ---------------- SEMANA ---------------- */
function renderSemana(){
  if(data.subjects.length===0){
    return `<h2 class="section-title">Semana de estudos</h2>
    <p class="empty-msg">Cadastre uma disciplina na aba "Disciplinas" antes de montar sua semana.</p>`;
  }
  let html = `<h2 class="section-title">Semana de estudos</h2><div class="week-grid">`;
  DAYS.forEach(day=>{
    const tasks = data.weeklyTasks.filter(t=>t.day===day);
    html += `<div class="day-card">
      <h3>${day}</h3>
      <div class="task-list">`;
    if(tasks.length===0){
      html += `<p class="empty-msg" style="font-size:12px;margin:0 0 8px;">Nada por aqui.</p>`;
    }
    tasks.forEach(t=>{
      const s = subjById(t.subjectId);
      html += `<div class="task-item">
        <input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''}>
        <div>
          ${s?`<span class="subj-tag" style="background:${s.color}22;color:${s.color}">${escapeHtml(s.name)}</span><br>`:''}
          <span class="txt ${t.done?'done':''}">${escapeHtml(t.text)}</span>
        </div>
        <button class="del-btn" data-action="del-task" data-id="${t.id}">×</button>
      </div>`;
    });
    html += `</div>
      <button class="add-task-btn" data-action="add-task" data-day="${day}">+ adicionar</button>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function openAddTaskModal(day){
  const opts = data.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  showModal(`
    <h3>Adicionar em ${day}</h3>
    <label>Disciplina</label>
    <select id="m-subject">${opts}</select>
    <label>O que estudar</label>
    <textarea id="m-text" placeholder="Ex: Ler capítulo 3, revisar exercícios..."></textarea>
  `, ()=>{
    const subjectId = document.getElementById('m-subject').value;
    const text = document.getElementById('m-text').value.trim();
    if(!text) return;
    data.weeklyTasks.push({ id:uid(), day, subjectId, text, done:false });
    saveData(); closeModal(); render();
  });
}

/* ---------------- CRONOGRAMA ---------------- */
function renderCronograma(){
  if(data.subjects.length===0){
    return `<h2 class="section-title">Cronograma do semestre</h2>
    <p class="empty-msg">Cadastre uma disciplina na aba "Disciplinas" antes de montar o cronograma.</p>`;
  }

  const weeks = [...new Set(data.syllabus.map(s=>s.week))].sort((a,b)=>a-b);

  let html = `<h2 class="section-title">Cronograma do semestre</h2>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">
    <label style="font-size:12px;color:var(--ink-soft);">Semana atual:</label>
    <input type="number" id="current-week-input" min="1" value="${data.currentWeek}" style="width:60px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;">
  </div>`;

  if(weeks.length===0){
    html += `<p class="empty-msg">Nenhum assunto cadastrado ainda. Use o formulário abaixo para colar o cronograma de cada disciplina.</p>`;
  } else {
    html += `<div class="syllabus-list">`;
    weeks.forEach(w=>{
      const entries = data.syllabus.filter(s=>s.week===w);
      const isCurrent = w===Number(data.currentWeek);
      html += `<div class="week-block ${isCurrent?'current':''}">
        <h3>Semana ${w}${isCurrent?' · atual':''}</h3>`;
      entries.forEach(en=>{
        const subj = subjById(en.subjectId);
        html += `<div class="syllabus-item">
          <div class="info">
            ${subj?`<span class="subj-tag" style="background:${subj.color}22;color:${subj.color}">${escapeHtml(subj.name)}</span><br>`:''}
            ${escapeHtml(en.topic)}
          </div>
          <button class="del-btn" data-action="del-syllabus" data-id="${en.id}">×</button>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  const subjOpts = data.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  html += `<form class="inline-form" id="syllabus-form">
    <input type="number" id="new-syl-week" min="1" placeholder="Sem." required>
    <select id="new-syl-subject">${subjOpts}</select>
    <input type="text" id="new-syl-topic" placeholder="Assunto (ex: Aula 1, Termodinâmica...)" required>
    <button type="submit" class="submit">Adicionar</button>
  </form>`;

  return html;
}

/* ---------------- DISCIPLINAS ---------------- */
function renderDisciplinas(){
  let html = `<h2 class="section-title">Disciplinas</h2><div class="subj-list">`;
  if(data.subjects.length===0){
    html += `<p class="empty-msg">Nenhuma disciplina cadastrada ainda.</p>`;
  }
  data.subjects.forEach(s=>{
    html += `<div class="subj-row">
      <div class="swatch" style="background:${s.color}"></div>
      <div class="name">${escapeHtml(s.name)}</div>
      <button data-action="del-subject" data-id="${s.id}">remover</button>
    </div>`;
  });
  html += `</div>
  <form class="inline-form" id="subject-form">
    <input type="color" id="new-subj-color" value="${SUBJ_COLORS[data.subjects.length % SUBJ_COLORS.length]}">
    <input type="text" id="new-subj-name" placeholder="Nome da disciplina" required>
    <button type="submit" class="submit">Adicionar</button>
  </form>`;
  return html;
}

/* ---------------- CALENDARIO ---------------- */
function renderCalendario(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = (first.getDay()+6)%7; // segunda=0
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  let html = `<h2 class="section-title">Calendário de prazos</h2>
  <div class="cal-header">
    <button data-action="prev-month">‹</button>
    <span class="month-label">${monthNames[calMonth]} ${calYear}</span>
    <button data-action="next-month">›</button>
  </div>
  <div class="cal-grid">`;
  DOW_LABELS.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayDeadlines = data.deadlines.filter(x=>x.date===iso);
    const isToday = iso===todayISO();
    const isSelected = iso===selectedDate;
    html += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" data-action="select-day" data-date="${iso}">
      <span class="num">${d}</span>
      <div class="dots">${dayDeadlines.map(x=>{
        const s=subjById(x.subjectId);
        return `<span class="dot" style="background:${s?s.color:'#999'}"></span>`;
      }).join('')}</div>
    </div>`;
  }
  html += `</div>`;

  html += `<div class="deadline-panel">`;
  if(selectedDate){
    const [y,m,dd] = selectedDate.split('-');
    const list = data.deadlines.filter(x=>x.date===selectedDate).sort((a,b)=>a.title.localeCompare(b.title));
    html += `<h3>${dd}/${m}/${y}</h3>`;
    if(list.length===0){
      html += `<p class="empty-msg">Nenhum prazo neste dia.</p>`;
    }
    list.forEach(x=>{
      const s = subjById(x.subjectId);
      html += `<div class="deadline-item">
        <div class="info">
          ${s?`<span class="subj-tag" style="background:${s.color}22;color:${s.color}">${escapeHtml(s.name)}</span><br>`:''}
          <div class="title">${escapeHtml(x.title)}</div>
          ${x.notes?`<div class="meta">${escapeHtml(x.notes)}</div>`:''}
        </div>
        <button data-action="del-deadline" data-id="${x.id}">×</button>
      </div>`;
    });
    html += `<button class="add-task-btn" data-action="add-deadline">+ adicionar prazo</button>`;
  } else {
    html += `<p class="empty-msg">Clique em um dia para ver ou adicionar prazos.</p>`;
  }
  html += `</div>`;

  const upcoming = data.deadlines
    .filter(x=>x.date>=todayISO())
    .sort((a,b)=>a.date.localeCompare(b.date))
    .slice(0,5);
  if(upcoming.length>0){
    html += `<h3 style="font-size:14px;font-weight:500;margin:20px 0 10px;font-family:'IBM Plex Mono',monospace;">Próximos prazos</h3>`;
    upcoming.forEach(x=>{
      const s = subjById(x.subjectId);
      const [y,m,dd] = x.date.split('-');
      html += `<div class="deadline-item">
        <div class="info">
          <div class="title">${escapeHtml(x.title)}</div>
          <div class="meta">${dd}/${m}/${y}${s?' · '+escapeHtml(s.name):''}</div>
        </div>
      </div>`;
    });
  }

  return html;
}

function openAddDeadlineModal(){
  if(data.subjects.length===0){
    showModal(`<h3>Adicionar prazo</h3><p class="empty-msg">Cadastre uma disciplina primeiro, na aba Disciplinas.</p>`, null);
    return;
  }
  const opts = data.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  showModal(`
    <h3>Novo prazo</h3>
    <label>Título</label>
    <input type="text" id="m-title" placeholder="Ex: Entrega do trabalho final">
    <label>Disciplina</label>
    <select id="m-subject">${opts}</select>
    <label>Observações (opcional)</label>
    <textarea id="m-notes" placeholder="Ex: enviar por e-mail até 23h59"></textarea>
  `, ()=>{
    const title = document.getElementById('m-title').value.trim();
    const subjectId = document.getElementById('m-subject').value;
    const notes = document.getElementById('m-notes').value.trim();
    if(!title) return;
    data.deadlines.push({ id:uid(), date:selectedDate, title, subjectId, notes });
    saveData(); closeModal(); render();
  });
}

/* ---------------- MODAL ---------------- */
function showModal(innerHtml, onSave){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${innerHtml}
    <div class="modal-actions">
      <button class="cancel" id="modal-cancel">Cancelar</button>
      ${onSave?'<button class="save" id="modal-save">Salvar</button>':''}
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  if(onSave) document.getElementById('modal-save').addEventListener('click', onSave);
}
function closeModal(){
  const el = document.getElementById('modal-overlay');
  if(el) el.remove();
}

/* ---------------- EVENT HANDLERS ---------------- */
function attachHandlers(){
  const main = document.getElementById('main');

  main.querySelectorAll('[data-action="toggle-task"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = data.weeklyTasks.find(x=>x.id===el.dataset.id);
      if(t){ t.done = el.checked; saveData(); render(); }
    });
  });
  main.querySelectorAll('[data-action="del-task"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      data.weeklyTasks = data.weeklyTasks.filter(x=>x.id!==el.dataset.id);
      saveData(); render();
    });
  });
  main.querySelectorAll('[data-action="add-task"]').forEach(el=>{
    el.addEventListener('click', ()=> openAddTaskModal(el.dataset.day));
  });

  const syllabusForm = document.getElementById('syllabus-form');
  if(syllabusForm){
    syllabusForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const week = Number(document.getElementById('new-syl-week').value);
      const subjectId = document.getElementById('new-syl-subject').value;
      const topic = document.getElementById('new-syl-topic').value.trim();
      if(!week || !topic) return;
      data.syllabus.push({ id:uid(), week, subjectId, topic });
      saveData(); render();
    });
  }
  main.querySelectorAll('[data-action="del-syllabus"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      data.syllabus = data.syllabus.filter(x=>x.id!==el.dataset.id);
      saveData(); render();
    });
  });
  const currentWeekInput = document.getElementById('current-week-input');
  if(currentWeekInput){
    currentWeekInput.addEventListener('change', ()=>{
      data.currentWeek = Number(currentWeekInput.value) || 1;
      saveData(); render();
    });
  }

  const subjForm = document.getElementById('subject-form');
  if(subjForm){
    subjForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = document.getElementById('new-subj-name').value.trim();
      const color = document.getElementById('new-subj-color').value;
      if(!name) return;
      data.subjects.push({ id:uid(), name, color });
      saveData(); render();
    });
  }
  main.querySelectorAll('[data-action="del-subject"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.id;
      data.subjects = data.subjects.filter(x=>x.id!==id);
      data.weeklyTasks = data.weeklyTasks.filter(x=>x.subjectId!==id);
      data.deadlines = data.deadlines.filter(x=>x.subjectId!==id);
      data.syllabus = data.syllabus.filter(x=>x.subjectId!==id);
      saveData(); render();
    });
  });

  main.querySelectorAll('[data-action="select-day"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedDate = el.dataset.date;
      render();
    });
  });
  const prevBtn = main.querySelector('[data-action="prev-month"]');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{
    calMonth--; if(calMonth<0){ calMonth=11; calYear--; } render();
  });
  const nextBtn = main.querySelector('[data-action="next-month"]');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    calMonth++; if(calMonth>11){ calMonth=0; calYear++; } render();
  });
  const addDeadlineBtn = main.querySelector('[data-action="add-deadline"]');
  if(addDeadlineBtn) addDeadlineBtn.addEventListener('click', openAddDeadlineModal);
  main.querySelectorAll('[data-action="del-deadline"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      data.deadlines = data.deadlines.filter(x=>x.id!==el.dataset.id);
      saveData(); render();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadData();
</script>
</body>
</html>
